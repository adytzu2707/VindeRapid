
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VindeRapid - Anunțuri gratuite</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }
    header {
      background: #087f5b;
      color: white;
      text-align: center;
      padding: 24px 12px;
    }
    header h1 { margin: 0 0 8px; }
    main {
      width: 92%;
      max-width: 650px;
      margin: 20px auto;
    }
    .panou {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }
    input, textarea, select, button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 7px;
    }
    input, textarea, select {
      border: 1px solid #ccc;
      background: white;
    }
    button {
      background: #087f5b;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .anunt {
      border: 1px solid #ddd;
      padding: 14px;
      border-radius: 8px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }
    .pret {
      color: #087f5b;
      font-size: 21px;
      font-weight: bold;
    }
    #mesaj { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>VindeRapid</h1>
    <div>Publică și găsește anunțuri gratuit!</div>
  </header>

  <main>
    <section class="panou">
      <h2>Publică un anunț</h2>
      <form id="formular">
        <input id="titlu" maxlength="120"
          placeholder="Titlul anunțului" required>

        <textarea id="descriere" maxlength="3000"
          placeholder="Descrierea produsului"></textarea>

        <input id="pret" type="number" min="0" step="0.01"
          placeholder="Preț în lei" required>

        <select id="categorie">
          <option value="Altele">Altele</option>
          <option value="Electronice">Electronice</option>
          <option value="Auto">Auto</option>
          <option value="Casa si gradina">Casă și grădină</option>
          <option value="Unelte">Unelte</option>
          <option value="Haine">Haine</option>
        </select>

        <input id="localitate" maxlength="100"
          placeholder="Localitate">

        <button id="buton" type="submit">Publică anunțul</button>
      </form>
      <p id="mesaj" role="status">Pregătire...</p>
    </section>

    <section class="panou">
      <h2>Anunțuri disponibile</h2>
      <div id="lista">Se încarcă anunțurile...</div>
    </section>
  </main>

  <script>
    const URL_SUPABASE =
      "https://ktcshtvohgxmupmyvcth.supabase.co";

    const CHEIE_PUBLICA =
      "sb_publishable_nS4V4SsKyG1wvtFplQQoKg_CTJSaBpr";

    const mesaj = document.getElementById("mesaj");
    const lista = document.getElementById("lista");
    const formular = document.getElementById("formular");
    const buton = document.getElementById("buton");

    async function cerere(path, options = {}) {
      const raspuns = await fetch(
        URL_SUPABASE + "/rest/v1/" + path,
        {
          ...options,
          headers: {
            apikey: CHEIE_PUBLICA,
            Authorization: "Bearer " + CHEIE_PUBLICA,
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        }
      );

      const text = await raspuns.text();

      if (!raspuns.ok) {
        throw new Error("HTTP " + raspuns.status + ": " + text);
      }

      return text ? JSON.parse(text) : null;
    }

    function afiseazaAnunturi(anunturi) {
      lista.replaceChildren();

      if (!anunturi || anunturi.length === 0) {
        lista.textContent = "Momentan nu există anunțuri.";
        return;
      }

      anunturi.forEach(function(a) {
        const card = document.createElement("article");
        card.className = "anunt";

        const titlu = document.createElement("h3");
        titlu.textContent = a.titlu || "Fără titlu";

        const pret = document.createElement("p");
        pret.className = "pret";
        pret.textContent = Number(a.pret).toLocaleString("ro-RO") + " lei";

        const descriere = document.createElement("p");
        descriere.textContent = a.descriere || "";

        const detalii = document.createElement("small");
        detalii.textContent =
          (a.categorie || "Altele") +
          (a.localitate ? " • " + a.localitate : "");

        card.append(titlu, pret, descriere, detalii);
        lista.appendChild(card);
      });
    }

    async function incarcaAnunturi() {
      lista.textContent = "Se încarcă anunțurile...";
      mesaj.textContent = "";

      try {
        const anunturi = await cerere(
          "anunturi?select=*&order=creat_la.desc"
        );
        afiseazaAnunturi(anunturi);
      } catch (err) {
        lista.textContent = "Nu s-au putut încărca anunțurile.";
        mesaj.textContent = "Eroare la încărcare: " + err.message;
      }
    }

    formular.addEventListener("submit", async function(e) {
      e.preventDefault();

      const titlu = document.getElementById("titlu").value.trim();
      const pret = Number(document.getElementById("pret").value);

      if (!titlu || !Number.isFinite(pret) || pret < 0) {
        mesaj.textContent = "Completează corect titlul și prețul.";
        return;
      }

      const anunt = {
        titlu: titlu,
        descriere: document.getElementById("descriere").value.trim(),
        pret: pret,
        categorie: document.getElementById("categorie").value,
        localitate: document.getElementById("localitate").value.trim()
      };

      buton.disabled = true;
      mesaj.textContent = "Se publică anunțul...";

      try {
        await cerere("anunturi", {
          method: "POST",
          headers: {
            Prefer: "return=minimal"
          },
          body: JSON.stringify(anunt)
        });

        mesaj.textContent = "Anunț publicat cu succes!";
        formular.reset();
        await incarcaAnunturi();
      } catch (err) {
        mesaj.textContent = "Publicare eșuată: " + err.message;
      } finally {
        buton.disabled = false;
      }
    });

    incarcaAnunturi();
  </script>
</body>
</html>
