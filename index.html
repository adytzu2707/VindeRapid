
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VindeRapid</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f3f5f7;color:#222}
header{background:#087f5b;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}
main{max-width:760px;margin:auto;padding:16px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0001}
h2{margin-top:0;font-size:20px}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#087f5b;color:white;border:0;font-weight:bold}
.ad{border-bottom:1px solid #ddd;padding:12px 0}
.price{color:#087f5b;font-size:20px;font-weight:bold}
small{color:#666}
</style>
</head>
<body>
<header>
<h1>VindeRapid</h1>
<p>Anunțuri simple, rapid și gratuit</p>
</header>
<main>
<section class="card">
<h2>Publică un anunț</h2>
<form id="form">
<input id="titlu" placeholder="Titlul anunțului" maxlength="120" required>
<textarea id="descriere" placeholder="Descrierea produsului" maxlength="3000"></textarea>
<input id="pret" type="number" min="0" step="0.01" placeholder="Preț în lei" required>
<select id="categorie">
<option>Altele</option><option>Electronice</option><option>Auto</option>
<option>Casă și grădină</option><option>Unelte</option><option>Modă</option>
</select>
<input id="localitate" placeholder="Localitate">
<button type="submit">Publică anunțul</button>
<p id="mesaj" aria-live="polite"></p>
</form>
</section>
<section class="card">
<h2>Anunțuri publicate</h2>
<input id="cautare" placeholder="Caută un anunț..." >
<div id="anunturi">Se încarcă anunțurile...</div>
</section>
</main>
<script>
const URL_SUPABASE = "https://ktcshtvohgxmupmyvcth.supabase.co";
const CHEIE_PUBLICA = "sb_publishable_nS4V4SsKyG1wvtFplQQoKg_CTJSaBpr";
const lista = document.getElementById("anunturi");
const mesaj = document.getElementById("mesaj");
let anunturi = [];

async function cerere(path, options={}) {
  const raspuns = await fetch(URL_SUPABASE + "/rest/v1/" + path, {
    ...options,
    headers: {
      apikey: CHEIE_PUBLICA,
      Authorization: "Bearer " + CHEIE_PUBLICA,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if (!raspuns.ok) throw new Error(await raspuns.text());
  return raspuns.status === 204 ? null : raspuns.json();
}

function sigur(text) {
  return String(text ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function afiseaza() {
  const cautare = document.getElementById("cautare").value.toLowerCase().trim();
  const filtrate = anunturi.filter(a =>
    [a.titlu,a.descriere,a.categorie,a.localitate]
      .some(v => String(v || "").toLowerCase().includes(cautare))
  );
  lista.innerHTML = filtrate.length ? filtrate.map(a => `
    <article class="ad">
      <h3>${sigur(a.titlu)}</h3>
      <div class="price">${sigur(a.pret)} lei</div>
      <p>${sigur(a.descriere)}</p>
      <small>${sigur(a.categorie)} · ${sigur(a.localitate || "Localitate nespecificată")}</small>
    </article>`).join("") : "Nu există anunțuri. Poți publica primul!";
}

async function incarca() {
  try {
    anunturi = await cerere("anunturi?select=*&order=creat_la.desc");
    afiseaza();
  } catch (e) {
    lista.textContent = "Nu s-au putut încărca anunțurile. Verifică cheia publică și setările tabelului Supabase.";
    console.error(e);
  }
}

document.getElementById("cautare").addEventListener("input", afiseaza);

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  mesaj.textContent = "Se publică...";
  const pret = Number(document.getElementById("pret").value);
  if (!Number.isFinite(pret) || pret < 0) {
    mesaj.textContent = "Introdu un preț valid.";
    return;
  }
  const date = {
    titlu: document.getElementById("titlu").value.trim(),
    descriere: document.getElementById("descriere").value.trim(),
    pret,
    categorie: document.getElementById("categorie").value,
    localitate: document.getElementById("localitate").value.trim()
  };
  try {
    await cerere("anunturi", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify(date)
    });
    mesaj.textContent = "Anunț publicat cu succes!";
    e.target.reset();
    await incarca();
  } catch (err) {
    mesaj.textContent = " mesaj.textContent = "Eroare: " + err.message;";
    console.error(err);
  }
});

incarca();
</script>
</body>
</html>
