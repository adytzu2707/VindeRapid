
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VindeRapid</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#17212b}
header{background:#0f766e;color:white;padding:24px 15px;text-align:center}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin:15px 0;border-radius:12px}
label{display:block;margin-top:12px;font-weight:bold}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border:1px solid #ccc;border-radius:8px;font-size:16px}
textarea{min-height:90px}
button{background:#0f766e;color:white;border:0;font-weight:bold;margin-top:16px}
.anunt{border:1px solid #ddd;border-radius:8px;padding:12px;margin-top:12px;overflow-wrap:anywhere}
.pret{font-size:20px;font-weight:bold;color:#0f766e}
</style>
</head>
<body>
<header>
<h1>VindeRapid</h1>
<p>Publică rapid. Vinde rapid.</p>
</header>
<main>
<section class="card">
<h2>Publică un anunț</h2>
<form id="formular">
<label for="titlu">Titlu</label>
<input id="titlu" maxlength="120" required>
<label for="descriere">Descriere</label>
<textarea id="descriere" maxlength="3000" required></textarea>
<label for="pret">Preț (lei)</label>
<input id="pret" type="number" min="0" step="0.01" required>
<label for="categorie">Categorie</label>
<select id="categorie" required>
<option value="">Alege categoria</option>
<option>Auto</option><option>Electronice</option>
<option>Casă și grădină</option><option>Unelte</option>
<option>Modă</option><option>Imobiliare</option>
<option>Servicii</option><option>Altele</option>
</select>
<label for="localitate">Localitate</label>
<input id="localitate" maxlength="100" required>
<button id="buton" type="submit">Publică anunțul</button>
</form>
<p id="mesaj"></p>
</section>
<section class="card">
<h2>Anunțuri publicate</h2>
<p id="status">Se verifică baza de date...</p>
<div id="lista"></div>
</section>
</main>
<script>
const URL_SUPABASE="https://ktcshtvohgxmupmyvcth.supabase.co";
const CHEIE_PUBLICA="sb_publishable_nS4V4SsKyG1wvtFplQQoKg_CTJSaBpr";

const formular=document.getElementById("formular");
const mesaj=document.getElementById("mesaj");
const lista=document.getElementById("lista");
const statusLista=document.getElementById("status");
const buton=document.getElementById("buton");

async function cerere(path,options={}){
 if(!CHEIE_PUBLICA.startsWith("sb_publishable_")){
  throw new Error("Cheia publică nu este configurată.");
 }
 const r=await fetch(URL_SUPABASE+"/rest/v1/"+path,{
  ...options,
  headers:{
   apikey:CHEIE_PUBLICA,
   Authorization:"Bearer "+CHEIE_PUBLICA,
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 if(!r.ok)throw new Error("Eroare "+r.status+": "+await r.text());
 if(r.status===204)return null;
 return r.json();
}

function text(tag,value,clasa=""){
 const e=document.createElement(tag);
 e.textContent=value??"";
 if(clasa)e.className=clasa;
 return e;
}

function afiseaza(anunturi){
 lista.replaceChildren();
 if(!anunturi.length){
  lista.appendChild(text("p","Nu există încă anunțuri."));
  return;
 }
 for(const a of anunturi){
  const card=document.createElement("article");
  card.className="anunt";
  card.appendChild(text("h3",a.titlu));
  card.appendChild(text("p",Number(a.pret).toLocaleString("ro-RO")+" lei","pret"));
  card.appendChild(text("p",a.descriere));
  card.appendChild(text("p","Categorie: "+a.categorie));
  card.appendChild(text("p","Localitate: "+a.localitate));
  lista.appendChild(card);
 }
}

async function incarcaAnunturi(){
 statusLista.textContent="Se încarcă anunțurile...";
 try{
  const a=await cerere("anunturi?select=id,titlu,descriere,pret,categorie,localitate,creat_la&order=creat_la.desc");
  afiseaza(a||[]);
  statusLista.textContent="Anunțuri încărcate: "+a.length;
 }catch(e){
  statusLista.textContent="Nu s-au putut încărca anunțurile.";
  lista.replaceChildren();
  lista.appendChild(text("p",e.message));
 }
}

formular.addEventListener("submit",async function(event){
 event.preventDefault();
 buton.disabled=true;
 mesaj.textContent="Se publică anunțul...";
 try{
  const a={
   titlu:document.getElementById("titlu").value.trim(),
   descriere:document.getElementById("descriere").value.trim(),
   pret:Number(document.getElementById("pret").value),
   categorie:document.getElementById("categorie").value,
   localitate:document.getElementById("localitate").value.trim()
  };
  await cerere("anunturi",{
   method:"POST",
   headers:{Prefer:"return=minimal"},
   body:JSON.stringify(a)
  });
  mesaj.textContent="Anunțul a fost publicat!";
  formular.reset();
  await incarcaAnunturi();
 }catch(e){
  mesaj.textContent="Eroare la publicare: "+e.message;
 }finally{
  buton.disabled=false;
 }
});

incarcaAnunturi();
</script>
</body>
</html>
